name: Windows 10 branch automation
# Main pushes and version tags keep the dedicated Windows 10 branch current.
# The reusable workflow is pinned to the windows10 branch so its .NET 8 and
# Windows 10 compatibility fixes are used for every automated sync.

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Main branch or tag to merge into windows10"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  sync-and-build:
    uses: Caliel666/NRLive/.github/workflows/windows10-sync-build.yml@windows10
    with:
      source_ref: ${{ github.event_name == 'push' && github.ref || inputs.source_ref }}
    permissions:
      contents: write

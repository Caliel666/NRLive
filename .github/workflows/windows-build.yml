name: Windows Build

on:
  push:
    branches:
      - "main"
      - "feature/dlssnr-0.0.6-nvidia-model-toggle"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dlssnr-runtime:
    name: Build DLSSNR-AMD bridge and runtime assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NRLive
        uses: actions/checkout@v4

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 unzip

      - name: Download pinned DLSSNR-AMD Windows source and runtime package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dlssnr-source" "$RUNNER_TEMP/dlssnr-release" build/dlssnr-runtime
          curl -L --fail --retry 5 --retry-delay 3 \
            https://github.com/mochizuki0323/DLSSNR-AMD/archive/refs/tags/v0.0.6-linux-preview.zip \
            -o "$RUNNER_TEMP/dlssnr-source.zip"
          curl -L --fail --retry 5 --retry-delay 3 \
            https://github.com/mochizuki0323/DLSSNR-AMD/releases/download/v0.0.5-win-preview/DLSSNR-AMD-Vulkan-Windows-0.0.5-win-preview-x86_64.zip \
            -o "$RUNNER_TEMP/dlssnr-runtime.zip"
          unzip -q "$RUNNER_TEMP/dlssnr-source.zip" -d "$RUNNER_TEMP/dlssnr-source"
          unzip -q "$RUNNER_TEMP/dlssnr-runtime.zip" -d "$RUNNER_TEMP/dlssnr-release"
          src="$(find "$RUNNER_TEMP/dlssnr-source" -type f -path '*/windows/src/core/nr_runtime.cpp' -printf '%h\n' | sed 's#/windows/src/core##' | head -n 1)"
          test -n "$src"
          mkdir -p "$src/toolchain"
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$src/toolchain/Vulkan-Headers"
          python3 scripts/port_dlssnr_006.py "$src"
          mkdir -p "$RUNNER_TEMP/dlssnr-small-extractor"
          python3 "$src/windows/package/model-tools/gen_extract_tables.py" \
            --descriptor "$src/linux/package/model-tools/descriptor-small.json" \
            --list "$src/linux/package/model-tools/model-files-small.txt" \
            --sums "$src/linux/package/model-tools/model-files-small.sha256" \
            --out "$RUNNER_TEMP/dlssnr-small-extractor/dlssnr_extract_tables.hpp"
          cp "$src/windows/package/model-tools/dlssnr_extract_model.cpp" "$RUNNER_TEMP/dlssnr-small-extractor/"
          # The 310.9.16 DLL embeds both the original and small/fast models.
          # Both extractors must accept this same DLL; their embedded layer tables
          # and per-weight SHA-256 checks still validate each model independently.
          sed -i 's/e16bcf15e16e13f527491cdf7845b2fe6521a738d8f7c9c721866a8496e1fc8e/2bc19bc09a7b89dd44f73e2ac0108fcc586e2154bdd0830f242f4f040e28789f/' \
            "$src/windows/package/model-tools/dlssnr_extract_model.cpp" \
            "$RUNNER_TEMP/dlssnr-small-extractor/dlssnr_extract_model.cpp"
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -municode \
            "$src/windows/package/model-tools/dlssnr_extract_model.cpp" \
            -o "$RUNNER_TEMP/dlssnr-extract-model.exe"
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -municode -DNR_MODEL_SMALL \
            "$RUNNER_TEMP/dlssnr-small-extractor/dlssnr_extract_model.cpp" \
            -o "$RUNNER_TEMP/dlssnr-extract-small-model.exe"
          DLSSNR_SOURCE="$src" bash scripts/build_dlssnr_bridge.sh build/dlssnr-runtime
          runtime_dir="$(find "$RUNNER_TEMP/dlssnr-release" -type d -name dlssnr-amd -print -quit)"
          tools_dir="$(find "$RUNNER_TEMP/dlssnr-release" -type d -name model-tools -print -quit)"
          test -n "$runtime_dir"
          test -n "$tools_dir"
          cp -a "$runtime_dir" build/dlssnr-runtime/
          rm -f build/dlssnr-runtime/dlssnr-amd/dlssnr.bin build/dlssnr-runtime/dlssnr-amd/dlssnr-small.bin
          cp "$RUNNER_TEMP/dlssnr-extract-model.exe" build/dlssnr-runtime/dlssnr_extract_model.exe
          cp "$RUNNER_TEMP/dlssnr-extract-small-model.exe" build/dlssnr-runtime/dlssnr_extract_small_model.exe
          cp "$src/LICENSE" build/dlssnr-runtime/DLSSNR-AMD-LICENSE.txt
          cp "$src/windows/package/README.txt" build/dlssnr-runtime/DLSSNR-AMD-UPSTREAM-README.txt
          test -s build/dlssnr-runtime/NRLiveDlssNrBridge.dll
          test -s build/dlssnr-runtime/dlssnr_extract_model.exe
          test -s build/dlssnr-runtime/dlssnr_extract_small_model.exe
          test -s build/dlssnr-runtime/DLSSNR-AMD-LICENSE.txt
          test -d build/dlssnr-runtime/dlssnr-amd/shaders
          test ! -e build/dlssnr-runtime/dlssnr-amd/dlssnr.bin
          du -sh build/dlssnr-runtime

      - name: Upload DLSSNR runtime
        uses: actions/upload-artifact@v4
        with:
          name: NRLive-dlssnr-amd-runtime
          path: build/dlssnr-runtime/**
          if-no-files-found: error

  build:
    name: Build + tests (FSR SDK 2.3.0)
    needs: dlssnr-runtime
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DLSSNR runtime bridge and shader data
        uses: actions/download-artifact@v4
        with:
          name: NRLive-dlssnr-amd-runtime
          path: build/dlssnr-runtime

      - name: Set up .NET 10 for the Windows launcher
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download AMD FSR SDK 2.3.0 headers and signed providers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceUrl = "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/archive/refs/tags/v2.3.0.zip"
          $runtimeUrl = "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/releases/download/v2.3.0/FidelityFX-Samples-v2.3.0-prebuilt.zip"
          $sourceZip = Join-Path $env:RUNNER_TEMP "fsr-sdk-source.zip"
          $runtimeZip = Join-Path $env:RUNNER_TEMP "fsr-sdk-runtime.zip"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "fsr-sdk-source"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "fsr-sdk-runtime"
          $binRoot = Join-Path $env:RUNNER_TEMP "fsr-sdk-bin"
          New-Item -ItemType Directory -Force $sourceRoot, $runtimeRoot, $binRoot | Out-Null

          curl.exe -L --fail --retry 5 --retry-delay 3 --output $sourceZip $sourceUrl
          curl.exe -L --fail --retry 5 --retry-delay 3 --output $runtimeZip $runtimeUrl
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $sourceRoot -Force
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeRoot -Force

          $sdk = Get-ChildItem -Path $sourceRoot -Directory | Select-Object -First 1
          if (-not $sdk) { throw "FSR SDK source archive did not extract." }
          foreach ($relative in @(
            "Kits/FidelityFX/api/include/ffx_api.h",
            "Kits/FidelityFX/framegeneration/include/ffx_framegeneration.h",
            "Kits/FidelityFX/framegeneration/include/dx12/ffx_api_framegeneration_dx12.h",
            "Kits/FidelityFX/upscalers/include/ffx_upscale.h"
          )) {
            if (-not (Test-Path (Join-Path $sdk.FullName $relative))) {
              throw "FSR SDK 2.3.0 header missing: $relative"
            }
          }

          $dllNames = @(
            "amd_fidelityfx_loader_dx12.dll",
            "amd_fidelityfx_framegeneration_dx12.dll",
            "amd_fidelityfx_upscaler_dx12.dll"
          )
          foreach ($dllName in $dllNames) {
            $found = Get-ChildItem -Path $runtimeRoot -Recurse -File -Filter $dllName | Select-Object -First 1
            if (-not $found) { throw "FSR SDK 2.3.0 runtime DLL missing from prebuilt package: $dllName" }
            Copy-Item -LiteralPath $found.FullName -Destination (Join-Path $binRoot $dllName) -Force
            Write-Host "$dllName => $($found.FullName)"
          }

          "FFX_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFX_BIN=$binRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FSR SDK root: $($sdk.FullName)"
          Write-Host "FSR runtime folder: $binRoot"

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -A x64 -DFFX_SDK="$env:FFX_SDK" -DFFX_BIN="$env:FFX_BIN" -DBUILD_TESTING=ON

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify runtime was staged
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "build/Release/NRLive.exe")) { throw "NRLive.exe was not produced." }
          foreach ($dll in @(
            "amd_fidelityfx_loader_dx12.dll",
            "amd_fidelityfx_framegeneration_dx12.dll",
            "amd_fidelityfx_upscaler_dx12.dll",
            "NRLiveDlssNrBridge.dll",
            "dlssnr_extract_model.exe",
            "dlssnr_extract_small_model.exe",
            "DLSSNR-AMD-LICENSE.txt",
            "DLSSNR-AMD-UPSTREAM-README.txt"
          )) {
            $runtimePath = if ($dll -in @("NRLiveDlssNrBridge.dll", "dlssnr_extract_model.exe", "dlssnr_extract_small_model.exe", "DLSSNR-AMD-LICENSE.txt", "DLSSNR-AMD-UPSTREAM-README.txt")) { "build/dlssnr-runtime/$dll" } else { "build/Release/$dll" }
            if (-not (Test-Path $runtimePath)) { throw "$dll was not staged: $runtimePath" }
          }

      - name: Publish and assemble portable launcher package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "build/package"
          dotnet publish ui/NRLiveUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $package
          if (-not (Test-Path "$package/NRLiveUI.exe")) { throw "NRLiveUI.exe was not produced." }

          # The launcher resolves NRLive.exe and the FSR provider DLLs relative
          # to its own directory. Keep the entire runnable application flat.
          Copy-Item "build/Release/NRLive.exe" $package -Force
          Copy-Item "build/Release/amd_fidelityfx_loader_dx12.dll" $package -Force
          Copy-Item "build/Release/amd_fidelityfx_framegeneration_dx12.dll" $package -Force
          Copy-Item "build/Release/amd_fidelityfx_upscaler_dx12.dll" $package -Force

          # The DLSSNR runtime is a separately built, MIT-licensed Vulkan bridge.
          # NVIDIA's model weights are not redistributed; users provide nvngx_dlssnr.dll
          # and run the extractors to create dlssnr-amd/dlssnr.bin and dlssnr-amd/dlssnr-small.bin.
          Copy-Item "build/dlssnr-runtime/NRLiveDlssNrBridge.dll" $package -Force
          Copy-Item "build/dlssnr-runtime/dlssnr_extract_model.exe" $package -Force
          Copy-Item "build/dlssnr-runtime/dlssnr_extract_small_model.exe" $package -Force
          Copy-Item "build/dlssnr-runtime/DLSSNR-AMD-LICENSE.txt" $package -Force
          Copy-Item "build/dlssnr-runtime/DLSSNR-AMD-UPSTREAM-README.txt" $package -Force
          Copy-Item "build/dlssnr-runtime/dlssnr-amd" $package -Recurse -Force
          Copy-Item "docs/DLSSNR-AMD-SETUP.txt" "$package/DLSSNR-AMD-SETUP.txt" -Force
          Copy-Item "version.txt" "$package/version.txt" -Force

          foreach ($file in @(
            "NRLiveUI.exe",
            "NRLive.exe",
            "amd_fidelityfx_loader_dx12.dll",
            "amd_fidelityfx_framegeneration_dx12.dll",
            "amd_fidelityfx_upscaler_dx12.dll",
            "NRLiveDlssNrBridge.dll",
            "dlssnr_extract_model.exe",
            "dlssnr_extract_small_model.exe",
            "DLSSNR-AMD-LICENSE.txt",
            "DLSSNR-AMD-UPSTREAM-README.txt",
            "DLSSNR-AMD-SETUP.txt"
          )) {
            if (-not (Test-Path (Join-Path $package $file))) { throw "Portable package is missing $file" }
          }
          if (-not (Test-Path "$package/dlssnr-amd/shaders")) { throw "DLSSNR shader runtime was not packaged." }
          if (Test-Path "$package/dlssnr-amd/dlssnr.bin") { throw "The package must not redistribute NVIDIA model weights." }
          if (Test-Path "$package/dlssnr-amd/dlssnr-small.bin") { throw "The package must not redistribute NVIDIA model weights." }
          $packageVersion = (Get-Content "$package/version.txt" -Raw).Trim()
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^[vV]', ''
            if ($packageVersion -ne $tagVersion) { throw "version.txt ($packageVersion) does not match release tag ($tagVersion)." }
          }
          Compress-Archive -Path "$package/*" -DestinationPath "build/NRLiveUI.zip" -Force
          Get-ChildItem $package | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NRLive-windows-x64-fsr-sdk-2.3.0
          # Upload the unpacked app as the Actions artifact. The actual release
          # asset remains NRLiveUI.zip; never put that ZIP inside the artifact's
          # app payload as a nested ZIP.
          path: build/package/**
          if-no-files-found: error


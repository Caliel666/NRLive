name: Windows 10 sync and build

on:
  push:
    branches:
      - windows10
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Main branch or tag to merge into windows10"
        required: true
        default: "main"
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: "Main branch or tag to merge into windows10"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows10-sync-build
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main/tag changes and reapply Windows 10 patches
    runs-on: windows-2022
    steps:
      - name: Checkout Windows 10 branch
        uses: actions/checkout@v4
        with:
          ref: windows10
          fetch-depth: 0
          persist-credentials: true

      - name: Merge selected main/tag revision into windows10 and reapply Windows 10 patches
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          git fetch origin "$env:SOURCE_REF"
          git merge -X ours --no-edit FETCH_HEAD
          $project = "ui/NRLiveUI.csproj"
          [xml]$xml = Get-Content -Raw $project
          $framework = $xml.Project.PropertyGroup | Where-Object { $_.TargetFramework } | Select-Object -First 1
          if (-not $framework) { throw "TargetFramework property not found in $project" }
          $framework.TargetFramework = "net8.0-windows"
          $xml.Save((Resolve-Path $project))
          git add $project
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply Windows 10 compatibility patches and target .NET 8"
          }
          $cmake = "CMakeLists.txt"
          $cmakeText = Get-Content -Raw $cmake
          $oldDefs = "UNICODE _UNICODE NOMINMAX WIN32_LEAN_AND_MEAN PLATFORM_WINDOWS"
          $newDefs = "UNICODE _UNICODE NOMINMAX WIN32_LEAN_AND_MEAN PLATFORM_WINDOWS WINVER=0x0A00 _WIN32_WINNT=0x0A00"
          if ($cmakeText.Contains($oldDefs) -and -not $cmakeText.Contains($newDefs)) {
            $cmakeText = $cmakeText.Replace($oldDefs, $newDefs)
            Set-Content -Path $cmake -Value $cmakeText -NoNewline
          }
          git add $project $cmake
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply Windows 10 compatibility patches and target .NET 8"
          }
          git push origin HEAD:windows10

  dlssnr-runtime:
    needs: sync
    name: Build DLSSNR bridge and stage runtime assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected Windows 10 branch
        uses: actions/checkout@v4
        with:
          ref: windows10

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 unzip

      - name: Build bridge and stage upstream runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dlssnr-source" "$RUNNER_TEMP/dlssnr-release" build/dlssnr-runtime
          curl -L --fail --retry 5 --retry-delay 3 https://github.com/mochizuki0323/DLSSNR-AMD/archive/refs/tags/v0.0.5-win-preview.zip -o "$RUNNER_TEMP/dlssnr-source.zip"
          curl -L --fail --retry 5 --retry-delay 3 https://github.com/mochizuki0323/DLSSNR-AMD/releases/download/v0.0.5-win-preview/DLSSNR-AMD-Vulkan-Windows-0.0.5-win-preview-x86_64.zip -o "$RUNNER_TEMP/dlssnr-runtime.zip"
          unzip -q "$RUNNER_TEMP/dlssnr-source.zip" -d "$RUNNER_TEMP/dlssnr-source"
          unzip -q "$RUNNER_TEMP/dlssnr-runtime.zip" -d "$RUNNER_TEMP/dlssnr-release"
          src="$(find "$RUNNER_TEMP/dlssnr-source" -type f -path '*/windows/src/core/nr_runtime.cpp' -printf '%h\n' | sed 's#/windows/src/core##' | head -n 1)"
          test -n "$src"
          mkdir -p "$src/toolchain"
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$src/toolchain/Vulkan-Headers"
          DLSSNR_SOURCE="$src" bash scripts/build_dlssnr_bridge.sh build/dlssnr-runtime
          runtime_dir="$(find "$RUNNER_TEMP/dlssnr-release" -type d -name dlssnr-amd -print -quit)"
          tools_dir="$(find "$RUNNER_TEMP/dlssnr-release" -type d -name model-tools -print -quit)"
          test -n "$runtime_dir"
          test -n "$tools_dir"
          cp -a "$runtime_dir" build/dlssnr-runtime/
          rm -f build/dlssnr-runtime/dlssnr-amd/dlssnr.bin
          cp "$tools_dir/dlssnr_extract_model.exe" build/dlssnr-runtime/
          cp "$src/LICENSE" build/dlssnr-runtime/DLSSNR-AMD-LICENSE.txt
          cp "$src/windows/package/README.txt" build/dlssnr-runtime/DLSSNR-AMD-UPSTREAM-README.txt
          test -s build/dlssnr-runtime/NRLiveDlssNrBridge.dll
          test -s build/dlssnr-runtime/dlssnr_extract_model.exe
          test -d build/dlssnr-runtime/dlssnr-amd/shaders
      - name: Upload DLSSNR runtime
        uses: actions/upload-artifact@v4
        with:
          name: NRLive-windows10-dlssnr-runtime
          path: build/dlssnr-runtime/**
          if-no-files-found: error

  sync-and-build:
    name: Build and test Windows 10 package
    needs: [sync, dlssnr-runtime]
    runs-on: windows-2022
    steps:
      - name: Checkout Windows 10 branch
        uses: actions/checkout@v4
        with:
          ref: windows10
          fetch-depth: 0
          persist-credentials: true

      - name: Download DLSSNR runtime
        uses: actions/download-artifact@v4
        with:
          name: NRLive-windows10-dlssnr-runtime
          path: build/dlssnr-runtime

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download AMD FSR SDK 2.3.0 headers and signed providers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceUrl = "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/archive/refs/tags/v2.3.0.zip"
          $runtimeUrl = "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/releases/download/v2.3.0/FidelityFX-Samples-v2.3.0-prebuilt.zip"
          $sourceZip = Join-Path $env:RUNNER_TEMP "fsr-sdk-source.zip"
          $runtimeZip = Join-Path $env:RUNNER_TEMP "fsr-sdk-runtime.zip"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "fsr-sdk-source"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "fsr-sdk-runtime"
          $binRoot = Join-Path $env:RUNNER_TEMP "fsr-sdk-bin"
          New-Item -ItemType Directory -Force $sourceRoot, $runtimeRoot, $binRoot | Out-Null
          curl.exe -L --fail --retry 5 --retry-delay 3 --output $sourceZip $sourceUrl
          curl.exe -L --fail --retry 5 --retry-delay 3 --output $runtimeZip $runtimeUrl
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $sourceRoot -Force
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeRoot -Force
          $sdk = Get-ChildItem -Path $sourceRoot -Directory | Select-Object -First 1
          if (-not $sdk) { throw "FSR SDK source archive did not extract." }
          foreach ($relative in @(
            "Kits/FidelityFX/api/include/ffx_api.h",
            "Kits/FidelityFX/framegeneration/include/ffx_framegeneration.h",
            "Kits/FidelityFX/framegeneration/include/dx12/ffx_api_framegeneration_dx12.h",
            "Kits/FidelityFX/upscalers/include/ffx_upscale.h"
          )) {
            if (-not (Test-Path (Join-Path $sdk.FullName $relative))) { throw "FSR SDK header missing: $relative" }
          }
          foreach ($dllName in @("amd_fidelityfx_loader_dx12.dll", "amd_fidelityfx_framegeneration_dx12.dll", "amd_fidelityfx_upscaler_dx12.dll")) {
            $found = Get-ChildItem -Path $runtimeRoot -Recurse -File -Filter $dllName | Select-Object -First 1
            if (-not $found) { throw "FSR runtime DLL missing: $dllName" }
            Copy-Item -LiteralPath $found.FullName -Destination (Join-Path $binRoot $dllName) -Force
          }
          "FFX_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFX_BIN=$binRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure native build
        shell: pwsh
        run: cmake -S . -B build -A x64 -DFFX_SDK="$env:FFX_SDK" -DFFX_BIN="$env:FFX_BIN" -DBUILD_TESTING=ON

      - name: Build native app and tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish .NET 8 launcher and assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "build/windows10-package"
          dotnet publish ui/NRLiveUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $package
          if (-not (Test-Path "$package/NRLiveUI.exe")) { throw ".NET 8 NRLiveUI.exe was not produced." }
          Copy-Item "build/Release/NRLive.exe" $package -Force
          foreach ($dll in @("amd_fidelityfx_loader_dx12.dll", "amd_fidelityfx_framegeneration_dx12.dll", "amd_fidelityfx_upscaler_dx12.dll")) {
            Copy-Item "build/Release/$dll" $package -Force
          }
          Copy-Item "build/dlssnr-runtime/NRLiveDlssNrBridge.dll" $package -Force
          Copy-Item "build/dlssnr-runtime/dlssnr_extract_model.exe" $package -Force
          Copy-Item "build/dlssnr-runtime/DLSSNR-AMD-LICENSE.txt" $package -Force
          Copy-Item "build/dlssnr-runtime/DLSSNR-AMD-UPSTREAM-README.txt" $package -Force
          Copy-Item "build/dlssnr-runtime/dlssnr-amd" $package -Recurse -Force
          Copy-Item "docs/DLSSNR-AMD-SETUP.txt" "$package/DLSSNR-AMD-SETUP.txt" -Force
          Copy-Item "version.txt" "$package/version.txt" -Force
          foreach ($file in @("NRLiveUI.exe","NRLive.exe","NRLiveDlssNrBridge.dll","dlssnr_extract_model.exe","amd_fidelityfx_loader_dx12.dll","amd_fidelityfx_framegeneration_dx12.dll","amd_fidelityfx_upscaler_dx12.dll","DLSSNR-AMD-SETUP.txt")) {
            if (-not (Test-Path (Join-Path $package $file))) { throw "Portable package is missing $file" }
          }
          if (Test-Path "$package/dlssnr-amd/dlssnr.bin") { throw "The package must not redistribute model weights." }
          if ((Get-Content "$package/version.txt" -Raw).Trim() -ne "2.1.0-win10") { throw "Windows 10 version.txt must be 2.1.0-win10." }
          $zip = "build/NRLiveUI-win10.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "NRLiveUI-win10.zip was not created." }

      - name: Upload Windows 10 package
        uses: actions/upload-artifact@v4
        with:
          name: NRLive-windows10-net8-x64
          path: |
            build/windows10-package/**
            build/NRLiveUI-win10.zip
          if-no-files-found: error

      - name: Attach Windows 10 package to the matching GitHub release
        if: startsWith(inputs.source_ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:SOURCE_REF -replace '^refs/tags/', ''
          $ready = $false
          for ($attempt = 0; $attempt -lt 45; $attempt++) {
            gh release view $tag --repo Caliel666/NRLive *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 20
          }
          if (-not $ready) { throw "GitHub release $tag was not created by the Windows build workflow in time." }
          gh release upload $tag build/NRLiveUI-win10.zip --repo Caliel666/NRLive --clobber
